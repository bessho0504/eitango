<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>英単語暗記アプリ</title>
  <style>
    :root {
      --primary: #334155;
      --primary-dark: #1e293b;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #eef2f6;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #fce7f3 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 16px 24px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 18px 0 20px;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    header p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary,
    .btn-secondary,
    .btn-outline,
    .btn-success {
      background: rgba(255,255,255,0.95);
      color: var(--text);
      border: 1.5px solid rgba(226,232,240,0.95);
    }
    .btn-primary:active,
    .btn-secondary:active,
    .btn-outline:active,
    .btn-success:active {
      background: #f1f5f9;
    }
    .btn-sm {
      padding: 11px 14px;
      font-size: 0.9rem;
      border-radius: 12px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    /* Cards */
    .card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.8);
      margin-bottom: 16px;
    }

    /* Direction toggle */
    .direction-toggle {
      display: flex;
      background: rgba(255,255,255,0.7);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .direction-toggle button {
      flex: 1;
      padding: 11px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
    }
    .direction-toggle button.active {
      background: white;
      color: var(--text);
      border: 1.5px solid #94a3b8;
      box-shadow: var(--shadow-sm);
    }

    #quizCountToggle {
      background: transparent;
      padding: 0;
      gap: 8px;
      border: none;
      box-shadow: none;
    }
    #quizCountToggle button {
      flex: 0 0 auto;
      min-width: 48px;
      padding: 9px 11px;
      background: rgba(255,255,255,0.95);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    #quizCountToggle button.active {
      background: white;
      color: var(--text);
      border-color: #94a3b8;
      box-shadow: var(--shadow-sm);
    }

    /* Home */
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 4px 0 16px;
    }
    .mode-btn {
      background: rgba(255,255,255,0.95);
      border: 1.5px solid rgba(226,232,240,0.9);
      border-radius: var(--radius);
      padding: 22px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: var(--shadow);
    }
    .mode-btn:active {
      border-color: #94a3b8;
      background: #f8fafc;
      transform: scale(0.98);
    }
    .mode-btn .icon {
      font-size: 1.9rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
    }
    .mode-btn .label {
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: -0.01em;
    }
    .mode-btn .desc {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.35;
    }
    .mode-btn.full { grid-column: 1 / -1; }

    .stats {
      display: flex;
      justify-content: space-around;
      text-align: center;
      padding: 6px 0 2px;
      gap: 8px;
    }
    .stat-item {
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 14px;
      transition: background 0.15s;
      flex: 1;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border: 1px solid var(--border);
    }
    .stat-item:active {
      background: #e2e8f0;
    }
    .stat-item .num {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
    }
    .stat-item .label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 600;
    }
    .stats-hint {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin: 10px 0 0;
      line-height: 1.4;
    }

    /* Quiz */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .progress-bar {
      height: 8px;
      background: rgba(226,232,240,0.9);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #64748b, #334155);
      transition: width 0.3s ease;
      border-radius: 999px;
    }

    .question-card {
      background: rgba(255,255,255,0.95);
      border-radius: 22px;
      padding: 32px 22px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.9);
      margin-bottom: 20px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .question-word {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      word-break: break-word;
    }
    .question-hint {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 10px;
    }
    .speak-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--primary);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .speak-btn:active { background: #dbeafe; }

    /* 正解・不正解オーバーレイ */
    .result-mark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 800;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 5;
    }
    .result-mark.show {
      opacity: 1;
    }
    .result-mark.correct {
      color: var(--success);
      background: rgba(220, 252, 231, 0.85);
    }
    .result-mark.wrong {
      color: var(--danger);
      background: rgba(254, 226, 226, 0.85);
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice-btn {
      background: rgba(255,255,255,0.95);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
      box-shadow: var(--shadow-sm);
    }
    .choice-btn:active { transform: scale(0.98); }
    .choice-btn.correct {
      background: #dcfce7;
      border-color: var(--success);
      color: var(--success);
    }
    .choice-btn.wrong {
      background: #fee2e2;
      border-color: var(--danger);
      color: var(--danger);
    }
    .choice-btn.disabled { pointer-events: none; }

    .typing-input {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      text-align: center;
      margin-bottom: 12px;
      color: var(--text);
    }
    .typing-input:focus { border-color: #94a3b8; }
    .typing-input.correct { border-color: var(--success); background: #dcfce7; }
    .typing-input.wrong { border-color: var(--danger); background: #fee2e2; }

    .feedback {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      min-height: 28px;
      margin: 8px 0;
    }
    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--danger); }

    /* ===== 暗記一覧モード ===== */
    .memo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .memo-header .title {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .memo-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .memo-controls .btn {
      width: auto;
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .memo-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 16px;
    }

    .memo-item {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 15px 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226,232,240,0.9);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 68px;
    }
    .memo-item:active { transform: scale(0.98); }
    .memo-item.flipped {
      background: #f8fafc;
      border-left: 4px solid #94a3b8;
    }
    .memo-controls .btn.selected,
    .btn.selected {
      border-color: #94a3b8;
      box-shadow: var(--shadow-sm);
      background: white;
    }

    .memo-item .speak-mini {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--primary);
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .memo-item .speak-mini:active { background: #dbeafe; }

    .memo-item .content {
      flex: 1;
      min-width: 0;
    }
    .memo-item .main-text {
      font-weight: 600;
      font-size: 1.05rem;
      word-break: break-word;
    }
    .memo-item .sub-text {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .memo-item .sub-text.acc.low { color: var(--danger); }
    .memo-item .sub-text.acc.mid { color: var(--warning); }
    .memo-item .sub-text.acc.high { color: var(--success); }
    .memo-item .tap-hint {
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* Result */
    .result-card {
      text-align: center;
      padding: 32px 20px;
    }
    .result-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
    }
    .result-detail {
      color: var(--muted);
      margin: 8px 0 24px;
    }

    /* Word List */
    .word-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .word-item {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 15px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226,232,240,0.9);
    }
    .word-item .en { font-weight: 700; font-size: 1.02rem; letter-spacing: -0.01em; }
    .word-item .ja { font-size: 0.9rem; color: var(--muted); }
    .word-item .acc { font-size: 0.75rem; margin-top: 2px; }
    .word-item .acc.low { color: var(--danger); }
    .word-item .acc.mid { color: var(--warning); }
    .word-item .acc.high { color: var(--success); }
    .word-item .actions { display: flex; gap: 6px; }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:active { background: var(--border); }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .form-group input {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
    }
    .form-group input:focus { border-color: #94a3b8; }

    .bottom-bar {
      display: flex;
      gap: 10px;
      padding-top: 14px;
      margin-top: auto;
      position: sticky;
      bottom: 0;
      background: linear-gradient(transparent, rgba(238,242,246,0.96) 28%);
      padding-bottom: 14px;
      z-index: 10;
    }
    .top-back {
      margin-bottom: 4px;
    }
    .top-back .btn {
      width: auto;
      padding: 8px 14px;
      font-size: 0.9rem;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      background: #dbeafe;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 6px;
    }
    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .home-note {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 2px 0 14px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.85);
      border-radius: 14px;
      border: 1px solid rgba(226,232,240,0.95);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HOME SCREEN -->
    <div id="home" class="screen active">
      <header>
        <h1>英単語暗記</h1>
        <p>四択・タイピング・単語暗記</p>
      </header>

      <div class="card">
        <div class="stats">
          <div class="stat-item" onclick="playClick(); showScreen('wordlist')" title="単語リストを開く">
            <div class="num" id="totalWords">0</div>
            <div class="label">登録単語</div>
          </div>
          <div class="stat-item" onclick="playClick(); startWeakMemo()" title="苦手単語だけ見る">
            <div class="num" id="weakCount">0</div>
            <div class="label">苦手単語</div>
          </div>
        </div>
        <p class="stats-hint">※ タップで確認できます</p>
      </div>

      <div class="section-label">出題方向</div>
      <div class="direction-toggle" id="homeDirectionToggle">
        <button class="active" data-dir="en2ja" onclick="setDirection('en2ja')">英 → 日</button>
        <button data-dir="ja2en" onclick="setDirection('ja2en')">日 → 英</button>
      </div>

      <div class="section-label">問題数</div>
      <div class="direction-toggle" id="quizCountToggle" style="flex-wrap:wrap; gap:4px;">
        <button data-count="10" onclick="setQuizCount(10)">10</button>
        <button data-count="20" class="active" onclick="setQuizCount(20)">20</button>
        <button data-count="30" onclick="setQuizCount(30)">30</button>
        <button data-count="40" onclick="setQuizCount(40)">40</button>
        <button data-count="50" onclick="setQuizCount(50)">50</button>
        <button data-count="60" onclick="setQuizCount(60)">60</button>
        <button data-count="70" onclick="setQuizCount(70)">70</button>
        <button data-count="80" onclick="setQuizCount(80)">80</button>
        <button data-count="90" onclick="setQuizCount(90)">90</button>
        <button data-count="100" onclick="setQuizCount(100)">100</button>
        <button data-count="all" onclick="setQuizCount('all')">全て</button>
      </div>

      <p class="home-note">※ 正答率はタイピング（テスト）の結果だけが反映されます。四択は練習用です。</p>

      <div class="mode-grid">
        <div class="mode-btn" onclick="startQuiz('choice')">
          <div class="icon">🔢</div>
          <div class="label">四択クイズ</div>
          <div class="desc">練習用・選択肢から選ぶ</div>
        </div>
        <div class="mode-btn" onclick="startQuiz('typing')">
          <div class="icon">⌨️</div>
          <div class="label">タイピング</div>
          <div class="desc">テスト用・答えを入力</div>
        </div>
        <div class="mode-btn full" onclick="startMemo()">
          <div class="icon">📋</div>
          <div class="label">単語暗記</div>
          <div class="desc">全部並べてタップで日英切り替え</div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" onclick="showScreen('wordlist')">単語リストを管理</button>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz" class="screen">
      <div class="quiz-header">
        <span id="quizProgress">1 / 10</span>
        <span id="quizScore">正解 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>

      <div class="question-card">
        <button class="speak-btn" id="speakBtn" onclick="speakCurrent()" title="発音を聞く">🔊</button>
        <div class="question-word" id="questionWord">word</div>
        <div class="question-hint" id="questionHint">意味を選んでください</div>
        <div class="result-mark" id="resultMark"></div>
      </div>

      <div id="choicesArea" class="choices"></div>

      <div id="typingArea" style="display:none;">
        <input type="text" class="typing-input" id="typingInput" placeholder="答えを入力..." autocomplete="off" autocapitalize="off">
        <div class="feedback" id="typingFeedback"></div>
        <button class="btn btn-primary" id="checkBtn" onclick="checkTyping()">答え合わせ</button>
      </div>

      <div class="bottom-bar">
        <button class="btn btn-secondary btn-sm" onclick="confirmQuitQuiz()">やめる</button>
        <button class="btn btn-outline btn-sm" id="dontKnowBtn" onclick="dontKnow()">わからない</button>
        <button class="btn btn-primary btn-sm" id="nextBtn" style="display:none;" onclick="nextQuestion()">次へ →</button>
      </div>
    </div>

    <!-- MEMO / 単語暗記 SCREEN -->
    <div id="memo" class="screen">
      <div class="memo-header">
        <div class="title">単語暗記 <span class="badge" id="memoCount">0</span></div>
      </div>

      <div class="memo-controls" style="margin-bottom:8px;">
        <button class="btn btn-secondary" id="memoAccBtn" onclick="toggleMemoAcc()">正答率 表示/非表示</button>
        <button class="btn btn-secondary" id="memoFlipEn" onclick="flipAll(false)">全部英語</button>
        <button class="btn btn-secondary" id="memoFlipJa" onclick="flipAll(true)">全部日本語</button>
      </div>
      <div class="memo-controls" style="margin-bottom:8px;">
        <button class="btn btn-secondary" id="memoSortHigh" onclick="sortMemo('high')">正答率高い順</button>
        <button class="btn btn-secondary" id="memoSortLow" onclick="sortMemo('low')">正答率低い順</button>
        <button class="btn btn-secondary" id="memoShuffle" onclick="shuffleMemo()">シャッフル</button>
      </div>

    // ========== State ==========

    // ========== Sound System (Web Audio API) ==========
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine', volume = 0.25, slideTo = null) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slideTo) {
          osc.frequency.linearRampToValueAtTime(slideTo, ctx.currentTime + duration * 0.8);
        }
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playClick() {
      // ASMR系キーボードっぽい「カチッ」音
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        // ノイズ（カチッの本体）
        const len = Math.floor(ctx.sampleRate * 0.045);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          const t = i / len;
          // 最初に強く、すぐ減衰
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.2);
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;

        // 帯域を絞って「カチ」感を強調
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 2800;
        bp.Q.value = 1.8;

        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 800;

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.55, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        src.connect(bp);
        bp.connect(hp);
        hp.connect(g);
        g.connect(ctx.destination);
        src.start(now);

        // ほんの少しの金属クリック
        const click = ctx.createOscillator();
        const cg = ctx.createGain();
        click.type = 'square';
        click.frequency.setValueAtTime(4200, now);
        click.frequency.exponentialRampToValueAtTime(2100, now + 0.012);
        cg.gain.setValueAtTime(0.07, now);
        cg.gain.exponentialRampToValueAtTime(0.001, now + 0.018);
        click.connect(cg);
        cg.connect(ctx.destination);
        click.start(now);
        click.stop(now + 0.018);
      } catch (e) {}
    }

    function playCorrect() {
      // 明るい上昇音
      playTone(523, 0.12, 'sine', 0.22);          // C5

    function loadWords() {
      const saved = localStorage.getItem('vocab_words_v2');
      if (saved) {
        words = JSON.parse(saved);
        // 既存データもヒント付きに更新
        words.forEach(w => {
          if (w.en === 'ordinary' && w.ja === 'ふつうの') w.ja = 'ふつうの（o）';
          if (w.en === 'common' && w.ja === 'ふつうの') w.ja = 'ふつうの（c）';
        });
      } else {
        const old = localStorage.getItem('vocab_words');
        if (old) {
          words = JSON.parse(old).map(w => ({
            ...w,
            shown: w.shown || 0,
            correct: w.correct || 0
          }));
        } else {
          // 初回・未保存端末は空の単語リストから開始
          words = [];
        }
        saveWords();
      }
    }

      localStorage.setItem('vocab_words_v2', JSON.stringify(words));

      renderWordList();

      const saved = localStorage.getItem('vocab_stats');
      if (saved) {
        const stats = JSON.parse(saved);

          todayCorrect = stats.correct || 0;
        } else {
          todayCorrect = 0;
          saveStats();

      if (!w.shown || w.shown === 0) return false;
      return (w.correct / w.shown) < 0.6;
    }

      document.getElementById('totalWords').textContent = words.length;

    // ========== Pronunciation (Web Speech API) ==========
    function speak(text) {
      if (!window.speechSynthesis) {
        alert('このブラウザでは音声読み上げに対応していません');
        return;
      }
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      utter.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      // 女性の声を優先（名前に female / woman / zira / samantha 等）
      const enVoices = voices.filter(v => v.lang.startsWith('en'));
      const female = enVoices.find(v =>
        /female|woman|zira|samantha|karen|moira|tessa|fiona|victoria|google us english/i.test(v.name)
      ) || enVoices.find(v => /female/i.test(v.name));
      const enVoice = female || enVoices[0] || voices[0];
      if (enVoice) utter.voice = enVoice;

      window.speechSynthesis.speak(utter);
    }

    function speakCurrent() {
      const q = quizQueue[currentIndex];
      if (!q) return;
      speak(q.en);
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    // ========== Word Management ==========
    function getAccuracy(w) {
      if (!w.shown || w.shown === 0) return null;
      return Math.round((w.correct / w.shown) * 100);
    }

    function renderWordList() {
      const container = document.getElementById('wordListContainer');
      updateWordListControlSelected();

      if (words.length === 0) {
        container.innerHTML = '<div class="empty-state">単語がありません<br>編集モードで「＋ 追加」から登録してください</div>';
        return;
      }

      const sorted = [...words].sort((a, b) => {
        const accA = a.shown ? (a.correct / a.shown) : -1;
        const accB = b.shown ? (b.correct / b.shown) : -1;
        if (wordListSort === 'high') return accB - accA;
        if (wordListSort === 'low') return accA - accB;
        if (wordListSort === 'new') return (b.id || 0) - (a.id || 0);
        if (wordListSort === 'old') return (a.id || 0) - (b.id || 0);
        return accA - accB;
      });

      container.innerHTML = sorted.map(w => {
        const enabled = w.enabled !== false;
        const enCls = (!enabled && wordListEditMode) ? ' style="opacity:0.55;"' : '';

        // 普段：英単語・意味・発音（＋任意で正答率）
        if (!wordListEditMode) {
          let accHtml = '';
          if (wordListShowAcc) {
            const acc = getAccuracy(w);
            if (acc === null) {
              accHtml = '<div class="acc">未出題</div>';
            } else {
              const cls = acc < 60 ? 'low' : acc < 80 ? 'mid' : 'high';
              accHtml = '<div class="acc ' + cls + '">正答率 ' + acc + '%（' + w.correct + '/' + w.shown + '）</div>';
            }
          }
          return '<div class="word-item"><div><div class="en">' + escapeHtml(w.en) + '</div><div class="ja">' + escapeHtml(w.ja) + '</div>' + accHtml + '</div><div class="actions"><button class="icon-btn" onclick="speak(\'' + escapeAttr(w.en) + '\')" title="発音">🔊</button></div></div>';
        }

        // 編集モード：出題ON/OFF・編集・削除（＋任意で正答率）
        const onOff = enabled ? '出題ON' : '出題OFF';
        let accHtml = '';
        if (wordListShowAcc) {
          const acc = getAccuracy(w);
          if (acc === null) {
            accHtml = '<div class="acc">未出題</div>';
          } else {
            const cls = acc < 60 ? 'low' : acc < 80 ? 'mid' : 'high';
            accHtml = '<div class="acc ' + cls + '">正答率 ' + acc + '%（' + w.correct + '/' + w.shown + '）</div>';
          }
        }
        return '<div class="word-item"' + enCls + '><div><div class="en">' + escapeHtml(w.en) + '</div><div class="ja">' + escapeHtml(w.ja) + '</div>' + accHtml + '<div class="acc">' + onOff + '</div></div><div class="actions"><button class="icon-btn" onclick="toggleWordEnabled(' + w.id + ')" title="クイズに出す">' + (enabled ? '✅' : '⬜') + '</button><button class="icon-btn" onclick="editWord(' + w.id + ')" title="意味・スペルを修正">✏️</button><button class="icon-btn" onclick="deleteWord(' + w.id + ')" title="削除">🗑️</button></div></div>';
      }).join('');
    }

    function updateWordListControlSelected() {
      const accBtn = document.getElementById('wordListAccBtn');
      const editBtn = document.getElementById('wordListEditBtn');
      if (accBtn) accBtn.classList.toggle('selected', !!wordListShowAcc);
      if (editBtn) {
        editBtn.classList.toggle('selected', !!wordListEditMode);
        editBtn.textContent = wordListEditMode ? '編集終了' : '編集';
        editBtn.className = 'btn btn-outline' + (wordListEditMode ? ' selected' : '');
      }
      const sortMap = {
        high: 'wlSortHigh',
        low: 'wlSortLow',
        new: 'wlSortNew',
        old: 'wlSortOld'
      };
      Object.keys(sortMap).forEach(key => {
        const el = document.getElementById(sortMap[key]);
        if (el) el.classList.toggle('selected', wordListSort === key);
      });
    }

    function setWordListSort(mode) {
      wordListSort = mode;
      renderWordList();
    }

    function toggleWordEnabled(id) {
      const w = words.find(x => x.id == id);
      if (!w) return;
      w.enabled = (w.enabled === false) ? true : false;
      saveWords();
    }

    function saveWord() {
      const en = document.getElementById('inputEn').value.trim();
      const ja = document.getElementById('inputJa').value.trim();
      if (!en || !ja) {
        alert('英単語と日本語の両方を入力してください');
        return;
      }

      if (editingId) {
        const idx = words.findIndex(w => w.id == editingId);
        if (idx !== -1) {
          words[idx].en = en;
          words[idx].ja = ja;
        }
        wordListEditMode = true;
      } else {
        words.push({ id: Date.now(), en, ja, shown: 0, correct: 0, enabled: true });
      }
      saveWords();
      editingId = null;
      showScreen('wordlist');
    }

    function cancelWordForm() {
      editingId = null;
      showScreen('wordlist');
    }

    function editWord(id) {
      const w = words.find(w => w.id == id);
      if (!w) {
        alert('単語が見つかりません');
        return;
      }
      editingId = w.id;
      document.getElementById('formTitle').textContent = '単語を編集';
      document.getElementById('inputEn').value = w.en;
      document.getElementById('inputJa').value = w.ja;
      showScreen('addword');
    }

    function deleteWord(id) {
      if (!confirm('この単語を削除しますか？')) return;
      words = words.filter(w => w.id != id);
      saveWords();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ========== Weighted Quiz Queue ==========
    function buildWeightedQueue() {
      const active = words.filter(w => w.enabled !== false);
      const items = active.map(w => {
        let weight = 1;
        if (w.shown === 0) {
          weight = 3;
        } else {
          const acc = w.correct / w.shown;
          weight = Math.max(1, Math.round(10 * (1 - acc) + 1));
        }
        return { word: w, weight };
      });

      const queue = [];
      const pool = [...items];
      const maxLen = quizCount === 'all' ? active.length : Math.min(Number(quizCount) || 20, active.length);

      while (queue.length < maxLen && pool.length > 0) {
        const totalWeight = pool.reduce((s, i) => s + i.weight, 0);
        let r = Math.random() * totalWeight;
        let idx = 0;
        for (let i = 0; i < pool.length; i++) {
          r -= pool[i].weight;
          if (r <= 0) { idx = i; break; }
        }
        queue.push(pool[idx].word);
        pool.splice(idx, 1);
      }
      return queue;
    }

    // ========== Quiz ==========
    function startQuiz(mode) {
      const active = words.filter(w => w.enabled !== false);
      if (active.length < 4 && mode === 'choice') {
        alert('四択クイズには出題ONの単語が最低4つ必要です。');
        return;
      }
      if (active.length === 0) {
        alert('出題できる単語がありません。単語リストで出題ONにしてください。');
        return;
      }

      quizMode = mode;
      quizQueue = buildWeightedQueue();
      currentIndex = 0;
      correctCount = 0;
      answered = false;

      document.getElementById('choicesArea').style.display = mode === 'choice' ? 'flex' : 'none';
      document.getElementById('typingArea').style.display = mode === 'typing' ? 'block' : 'none';
      document.getElementById('nextBtn').style.display = 'none';

      showScreen('quiz');
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const q = quizQueue[currentIndex];
      const total = quizQueue.length;

      // 前の〇✕を消す
      const mark = document.getElementById('resultMark');
      if (mark) {
        mark.className = 'result-mark';
        mark.textContent = '';
      }

      document.getElementById('quizProgress').textContent = (currentIndex + 1) + ' / ' + total;
      document.getElementById('quizScore').textContent = '正解 ' + correctCount;
      document.getElementById('progressFill').style.width = ((currentIndex / total) * 100) + '%';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('dontKnowBtn').style.display = 'block';

      const showEn = direction === 'en2ja';
      document.getElementById('questionWord').textContent = showEn ? q.en : q.ja;
      document.getElementById('questionHint').textContent = showEn ? '日本語の意味は？' : '英単語は？';

      // 日→英のときは答えがバレるので発音ボタンを隠す
      document.getElementById('speakBtn').style.display = showEn ? 'flex' : 'none';

      if (quizMode === 'choice') {
        renderChoices(q);
      } else {
        const input = document.getElementById('typingInput');
        input.value = '';
        input.className = 'typing-input';
        input.disabled = false;
        document.getElementById('typingFeedback').textContent = '';
        document.getElementById('typingFeedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'block';
        document.getElementById('checkBtn').disabled = false;
        setTimeout(() => input.focus(), 100);
      }
    }

    function renderChoices(correct) {
      const showEn = direction === 'en2ja';
      const correctAnswer = showEn ? correct.ja : correct.en;

      let wrongs = words.filter(w => w.id !== correct.id && w.enabled !== false);
      wrongs = shuffle(wrongs).slice(0, 3);
      const options = shuffle([
        correctAnswer,
        ...wrongs.map(w => showEn ? w.ja : w.en)
      ]);

      const container = document.getElementById('choicesArea');
      container.innerHTML = options.map(opt => {
        return '<button class="choice-btn" onclick="selectChoice(this, \'' + escapeAttr(opt) + '\', \'' + escapeAttr(correctAnswer) + '\')">' + escapeHtml(opt) + '</button>';
      }).join('');
    }

    function selectChoice(btn, selected, correctAns) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(b => b.classList.add('disabled'));

      // 四択は練習用：単語の正答率（shown/correct）には反映しない
      if (selected === correctAns) {
        btn.classList.add('correct');
        correctCount++;
        playCorrect();
        showResultMark(true);
      } else {
        btn.classList.add('wrong');
        buttons.forEach(b => {
          if (b.textContent.trim() === correctAns) b.classList.add('correct');
        });
        playWrong();
        showResultMark(false);
      }

      document.getElementById('quizScore').textContent = '正解 ' + correctCount;
      document.getElementById('dontKnowBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'block';
    }

    function checkTyping() {
      if (answered) return;
      const input = document.getElementById('typingInput');
      const userAns = input.value.trim();
      if (!userAns) return;

      answered = true;
      const q = quizQueue[currentIndex];
      const correctAns = direction === 'en2ja' ? q.ja : q.en;

      q.shown = (q.shown || 0) + 1;

      // 判定をかなり緩くする（ひらがな・カタカナ同一視 + 複数意味）
      function toHiragana(s) {
        return String(s).replace(/[\u30A1-\u30F6]/g, ch =>
          String.fromCharCode(ch.charCodeAt(0) - 0x60)
        );
      }

      function normalize(s) {
        return toHiragana(String(s))
          .toLowerCase()
          .replace(/[\s　]/g, '')
          .replace(/[・\/／\(\)（）\[\]【】「」『』]/g, '')
          .replace(/[～〜~]/g, '')
          .replace(/[ー−–—]/g, '')
          .replace(/(する|される|される|な$|の$|を$|に$|が$|は$|で$|と$|へ$|や$|的$)/g, '')
          .replace(/(こと|もの|とき|時|場合)/g, '')
          .replace(/[ぁぃぅぇぉっゃゅょゎ]/g, ''); // 小書きは大書き扱いの簡易版は省略、除去で近似
      }

      function isSimilar(a, b) {
        const na = normalize(a);
        const nb = normalize(b);
        if (!na || !nb) return false;
        if (na === nb) return true;
        if (na.length >= 2 && nb.length >= 2) {
          if (na.includes(nb) || nb.includes(na)) return true;
        }
        // 2文字以上の共通部分が長い場合もOK（簡易）
        if (na.length >= 3 && nb.length >= 3) {
          const shorter = na.length <= nb.length ? na : nb;
          const longer = na.length > nb.length ? na : nb;
          if (shorter.length >= 3 && longer.includes(shorter)) return true;
        }
        return false;
      }

      // 候補を集める（登録意味 + 追加の許容意味）
      let candidates = String(correctAns).split(/[\/・／]/).map(s => s.trim()).filter(Boolean);

      // 英→日のときは ALT_MEANINGS も候補に加える
      if (direction === 'en2ja') {
        const key = (q.en || '').toLowerCase();
        if (ALT_MEANINGS[key]) {
          candidates = candidates.concat(ALT_MEANINGS[key]);
        }
        // ヒント括弧を除いた形も候補に
        candidates = candidates.concat(
          candidates.map(c => c.replace(/[（(].*?[）)]/g, '').trim()).filter(Boolean)
        );
      }

      let isCorrect = candidates.some(part => isSimilar(userAns, part));

      // さらに甘く：ユーザー入力が候補の核を含んでいればOK
      if (!isCorrect) {
        const user = normalize(userAns);
        isCorrect = candidates.some(part => {
          const core = normalize(part.replace(/[（(].*?[）)]/g, ''));
          return core.length >= 2 && (user.includes(core) || core.includes(user));
        });
      }

      const feedback = document.getElementById('typingFeedback');
      if (isCorrect) {
        input.classList.add('correct');
        feedback.textContent = '正解！';
        feedback.className = 'feedback correct';
        q.correct = (q.correct || 0) + 1;
        correctCount++;
        todayCorrect++;
        saveStats();
        playCorrect();
        showResultMark(true);
      } else {
        input.classList.add('wrong');
        feedback.textContent = '不正解 → ' + correctAns;
        feedback.className = 'feedback wrong';
        playWrong();
        showResultMark(false);
      }

      saveWords();
      input.disabled = true;
      document.getElementById('checkBtn').style.display = 'none';
      document.getElementById('quizScore').textContent = '正解 ' + correctCount;
      document.getElementById('dontKnowBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'block';
    }

    function dontKnow() {
      if (answered) return;
      answered = true;

      const q = quizQueue[currentIndex];
      const correctAns = direction === 'en2ja' ? q.ja : q.en;

      // タイピング（テスト）のときだけ正答率に反映。四択は練習なので反映しない
      if (quizMode === 'typing') {
        q.shown = (q.shown || 0) + 1;
      }

      if (quizMode === 'choice') {
        const buttons = document.querySelectorAll('.choice-btn');
        buttons.forEach(b => {
          b.classList.add('disabled');
          if (b.textContent.trim() === correctAns) b.classList.add('correct');
        });
      } else {
        const input = document.getElementById('typingInput');
        input.disabled = true;
        input.classList.add('wrong');
        document.getElementById('typingFeedback').textContent = '正解 → ' + correctAns;
        document.getElementById('typingFeedback').className = 'feedback wrong';
        document.getElementById('checkBtn').style.display = 'none';
      }

      playWrong();
      showResultMark(false);
      if (quizMode === 'typing') saveWords();
      document.getElementById('quizScore').textContent = '正解 ' + correctCount;
      document.getElementById('dontKnowBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'block';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('quiz').classList.contains('active') && quizMode === 'typing' && !answered) {
        checkTyping();
      }
    });

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= quizQueue.length) {
        showResult();
      } else {
        showQuestion();
      }
    }

    function showResult() {
      const total = quizQueue.length;
      const rate = total ? Math.round((correctCount / total) * 100) : 0;
      document.getElementById('resultScore').textContent = correctCount + ' / ' + total;
      document.getElementById('resultDetail').textContent = '正解率 ' + rate + '%';
      document.getElementById('progressFill').style.width = '100%';
      showScreen('result');
    }

    function retryQuiz() {
      startQuiz(quizMode);
    }

    function confirmQuitQuiz() {
      if (confirm('クイズを中断してホームに戻りますか？')) {
        showScreen('home');
      }
    }

    // ========== 暗記一覧モード ==========
    let memoTitleMode = 'all'; // 'all' | 'weak'
    let memoEnabledOnly = false; // 出題ONの単語だけ表示

    function getMemoBaseWords() {
      let list = memoTitleMode === 'weak' ? words.filter(isWeakWord) : words.slice();
      if (memoEnabledOnly) list = list.filter(w => w.enabled !== false);
      return list;
    }

    function rebuildMemoOrder(keepSort) {
      const base = getMemoBaseWords();
      if (!keepSort) {
        memoOrder = base.map(w => w.id);
        return;
      }
      // 現在の並びを可能な限り維持しつつ、対象外を外す
      const idSet = new Set(base.map(w => w.id));
      const kept = memoOrder.filter(id => idSet.has(id) || idSet.has(Number(id)) || [...idSet].some(x => x == id));
      const missing = base.map(w => w.id).filter(id => !kept.some(k => k == id));
      memoOrder = kept.concat(missing);
    }

    function startMemo() {
      if (words.length === 0) {
        alert('単語が登録されていません。');
        return;
      }
      memoTitleMode = 'all';
      memoEnabledOnly = false;
      memoOrder = words.map(w => w.id);
      openMemoScreen();
    }

    function startWeakMemo() {
      const weak = words.filter(isWeakWord);
      if (weak.length === 0) {
        alert('苦手単語はありません。\n（タイピングで正答率60%未満の単語がここに入ります）');
        return;
      }
      memoTitleMode = 'weak';
      memoEnabledOnly = false;
      memoOrder = weak.map(w => w.id);
      openMemoScreen();
    }

    function openMemoScreen() {
      memoFlipped = {};
      memoOrder.forEach(id => {
        memoFlipped[id] = (direction === 'ja2en');
      });
      showScreen('memo');
      const titleEl = document.querySelector('#memo .memo-header .title');
      if (titleEl) {
        const label = memoTitleMode === 'weak' ? '苦手単語' : '単語暗記';
        titleEl.innerHTML = label + ' <span class="badge" id="memoCount">0</span>';
      }
      setMemoFlipSelected(direction === 'ja2en');
      ['memoSortHigh', 'memoSortLow', 'memoSortNew', 'memoSortOld', 'memoShuffle'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('selected');
      });
      const accBtn = document.getElementById('memoAccBtn');
      if (accBtn) accBtn.classList.toggle('selected', !!memoShowAcc);
      const enBtn = document.getElementById('memoFilterEnabled');
      if (enBtn) enBtn.classList.toggle('selected', !!memoEnabledOnly);
      renderMemoList();
    }

    function renderMemoList() {
      const container = document.getElementById('memoList');
      const countEl = document.getElementById('memoCount');
      if (countEl) countEl.textContent = memoOrder.length;

      const orderedWords = memoOrder
        .map(id => words.find(w => w.id === id))
        .filter(Boolean);

      container.innerHTML = orderedWords.map(w => {
        const flipped = memoFlipped[w.id];
        const mainText = flipped ? w.ja : w.en;
        let accHtml = '';
        if (memoShowAcc) {
          const acc = getAccuracy(w);
          if (acc === null) {
            accHtml = '<div class="sub-text">未出題</div>';
          } else {
            const cls = acc < 60 ? 'low' : acc < 80 ? 'mid' : 'high';
            accHtml = '<div class="sub-text acc ' + cls + '">正答率 ' + acc + '%（' + w.correct + '/' + w.shown + '）</div>';
          }
        }
        return '<div class="memo-item ' + (flipped ? 'flipped' : '') + '" onclick="toggleMemoItem(' + w.id + ')"><button class="speak-mini" onclick="event.stopPropagation(); speak(\'' + escapeAttr(w.en) + '\')" title="発音">🔊</button><div class="content"><div class="main-text">' + escapeHtml(mainText) + '</div>' + accHtml + '</div><div class="tap-hint">' + (flipped ? '日 → 英' : '英 → 日') + '</div></div>';
      }).join('');
    }

    function setMemoSortSelected(which) {
      ['memoSortHigh', 'memoSortLow', 'memoSortNew', 'memoSortOld', 'memoShuffle'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('selected', id === which);
      });
    }

    function setMemoFlipSelected(toJapanese) {
      const en = document.getElementById('memoFlipEn');
      const ja = document.getElementById('memoFlipJa');
      if (en) en.classList.toggle('selected', !toJapanese);
      if (ja) ja.classList.toggle('selected', !!toJapanese);
    }

    function sortMemo(order) {
      // order: low / high / new / old（現在表示中の単語のみ）
      const items = memoOrder.map(id => {
        const w = words.find(x => x.id == id);
        if (!w) return null;
        const acc = w.shown ? (w.correct / w.shown) : -1;
        return { id: w.id, acc: acc, ts: Number(w.id) || 0 };
      }).filter(Boolean);

      if (order === 'low') items.sort((a, b) => a.acc - b.acc);
      else if (order === 'high') items.sort((a, b) => b.acc - a.acc);
      else if (order === 'new') items.sort((a, b) => b.ts - a.ts);
      else if (order === 'old') items.sort((a, b) => a.ts - b.ts);

      memoOrder = items.map(x => x.id);
      const map = { high: 'memoSortHigh', low: 'memoSortLow', new: 'memoSortNew', old: 'memoSortOld' };
      setMemoSortSelected(map[order] || null);
      renderMemoList();
    }

    function toggleMemoEnabledOnly() {
      memoEnabledOnly = !memoEnabledOnly;
      rebuildMemoOrder(true);
      const enBtn = document.getElementById('memoFilterEnabled');
      if (enBtn) enBtn.classList.toggle('selected', !!memoEnabledOnly);
      if (memoOrder.length === 0) {
        alert(memoEnabledOnly ? '出題ONの単語がありません。' : '表示できる単語がありません。');
      }
      renderMemoList();
    }

    function toggleMemoAcc() {
      memoShowAcc = !memoShowAcc;
      const btn = document.getElementById('memoAccBtn');
      if (btn) btn.classList.toggle('selected', !!memoShowAcc);
      renderMemoList();
    }

    function toggleMemoItem(id) {
      memoFlipped[id] = !memoFlipped[id];
      // 個別タップ時は全部英語/日本語の選択表示を外す
      const en = document.getElementById('memoFlipEn');
      const ja = document.getElementById('memoFlipJa');
      if (en) en.classList.remove('selected');
      if (ja) ja.classList.remove('selected');
      renderMemoList();
    }

    function flipAll(toJapanese) {
      memoOrder.forEach(id => {
        memoFlipped[id] = toJapanese;
      });
      setMemoFlipSelected(toJapanese);
      renderMemoList();
    }

    function shuffleMemo() {
      memoOrder = shuffle([...memoOrder]);
      setMemoSortSelected('memoShuffle');
      renderMemoList();
    }

    // ========== Utils ==========
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeAttr(str) {
      return String(str).replace(/'/g, "\\\\'").replace(/"/g, '&quot;');
    }

    // Start
    init();
  </script>
